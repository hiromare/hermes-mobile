name: Android Evaluation Release APK
run-name: Evaluation APK — HTTPS-only release build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-evaluation-apk:
    name: Build signed evaluation release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned fork branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Generate ephemeral evaluation signing key
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD="$(openssl rand -hex 20)"
          echo "::add-mask::$PASSWORD"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/dots-eval-release.p12" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=dots-evaluation" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          keytool -genkeypair -noprompt -keyalg RSA -keysize 3072 -validity 365 \
            -alias dots-evaluation -keystore "$RUNNER_TEMP/dots-eval-release.p12" \
            -storetype PKCS12 -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=Hermes Mobile Evaluation, O=Private Pilot, C=JP"

      - name: Verify release HTTPS-only settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          g=Path("app/build.gradle.kts").read_text()
          release=g.split("release {",1)[1].split("compileOptions {",1)[0]
          assert 'ALLOW_CLEARTEXT", "false"' in release
          assert 'usesCleartextTraffic"] = "false"' in release
          assert ET.parse("app/src/main/res/xml/network_security_config.xml").getroot().find("base-config").attrib["cleartextTrafficPermitted"] == "false"
          print("Release transport policy: HTTPS-only")
          PY

      - name: Build signed release
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify signature and manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | grep -m1 '^package:'
          echo "Evaluation signer is EPHEMERAL: uninstall required before installing another signing identity."

      - name: Upload HTTPS-only evaluation APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-mobile-eval-https-only
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 3
